application:
  subdomain: composecraft
  multi_instance: false
  # The app ships its own account system (self-service sign-up at /signin),
  # so it is exposed directly instead of sitting behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://composecraft:3000/

services:
  mongo:
    image: docker.1ms.run/library/mongo:7
    # Reachable only on the app's internal container network: no upstream,
    # no published port. No auth is configured on purpose - a generated
    # password can contain characters that would break the connection URI,
    # and YAML templates cannot percent-encode. Only Compose Craft can reach it.
    command:
      - --bind_ip
      - 127.0.0.1,mongo
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping')" || exit 1
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    binds:
      - /lzcapp/var/mongo:/data/db

  composecraft:
    # upstream: composecraft/composecraft:1.1.3
    image: docker.1ms.run/composecraft/composecraft:1.1.3
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - CORE_ONLY=true
      - MONGODB_URI=mongodb://mongo:27017/compose_craft
      - |-
        SECRET_KEY={{ printf "%x" (stable_secret "secret_key") }}
      - TZ=Asia/Shanghai

usage: |
  Compose Craft 是一个图形化编辑 docker-compose.yml 的工具：拖拽服务、连线依赖，
  再导出成可直接使用的 compose 文件，不用手写 YAML。

  使用方法：
  1. 打开应用，用邮箱和密码直接注册（这是自建实例，注册不需要邮件验证）。
  2. 新建一个项目，从左侧拖入服务节点，连好依赖关系。
  3. 用右侧面板改镜像、端口、环境变量和卷。
  4. 完成后导出 docker-compose.yml，拿到自己的机器上跑。
  5. 配置可以一直存在应用里，下次继续改。

  数据与安全：
  - 项目数据保存在内置 MongoDB（/lzcapp/var/mongo），卸载应用会一并删除，请定期备份。
  - 登录凭据保存在同一个数据库里，密码以 bcrypt 哈希存储。
  - 随包固定了 JWT 签名密钥（SECRET_KEY），容器重建后不会把已登录用户踢下线。
  - 内置数据库只在应用的容器内网可达，没有对外端口，也没有经入口暴露。
  - 应用直接对外开放，由应用自己的注册/登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。
  - 本实例以 CORE_ONLY 模式运行，仅提供编辑器本身，不启用官方 SaaS 的计费等功能。

  说明：
  - 两个容器：Compose Craft + MongoDB 7，启动顺序由依赖关系保证。
  - 未做真机验证：注册、登录、新建项目、导出 compose 以及重启后数据持久化
    均未在设备上实测。
